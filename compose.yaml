services:
  en-marge:
    build: .
    ports:
      - "${PORT:-4173}:4173"
    environment:
      HOST: 0.0.0.0
      PORT: "4173"
      DATABASE_PATH: /app/data/en-marge.sqlite
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      HARDCOVER_API_TOKEN: ${HARDCOVER_API_TOKEN:-}
      METADATA_DISABLED_PROVIDERS: ${METADATA_DISABLED_PROVIDERS:-}
    volumes:
      - en-marge-data:/app/data
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  en-marge-data:
