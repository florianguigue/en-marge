services:
  en-marge:
    build: .
    environment:
      HOST: 0.0.0.0
      PORT: "4173"
      DATABASE_PATH: /app/data/en-marge.sqlite
      PUBLIC_URL: https://en-marge.home.florianguigue.fr
    volumes:
      - en-marge-data:/app/data
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      en-marge:
        condition: service_healthy
    restart: unless-stopped

volumes:
  en-marge-data:
  caddy-data:
  caddy-config:
